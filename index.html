<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>magahenderson</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: #0d0f17;
      color: #e1e4ed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .wrap {
      max-width: 520px;
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1.5rem;
      opacity: 0.6;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 0.95rem;
      color: #5a5e72;
      line-height: 1.7;
      margin-bottom: 0.5rem;
    }
    .line {
      width: 60px;
      height: 3px;
      background: #f0c059;
      border-radius: 2px;
      margin: 1.5rem auto;
    }
    .contact {
      font-size: 0.8rem;
      color: #3a3d4a;
      margin-top: 1rem;
    }
    .contact a {
      color: #7582ff;
      text-decoration: none;
    }
    .dot1, .dot2, .dot3 {
      animation: blink 1.4s infinite both;
    }
    .dot2 { animation-delay: 0.2s; }
    .dot3 { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">
      <span class="dot1">.</span><span class="dot2">.</span><span class="dot3">.</span>
    </div>
    <h1>Сайт на техническом обслуживании</h1>
    <p>Мы проводим плановые технические работы для улучшения сервиса. Скоро всё заработает.</p>
    <div class="line"></div>
    <div class="contact">По вопросам: <a href="mailto:maga@business.com">maga@business.com</a></div>
  </div>
</body>
</html>
